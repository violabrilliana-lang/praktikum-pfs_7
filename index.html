<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Data Mahasiswa - Praktikum Fullstack</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <h1>Data Mahasiswa</h1>

      <form id="form-mahasiswa" class="card">
        <input type="hidden" id="mahasiswa-id" />
        <div class="form-group">
          <label for="nama">Nama Mahasiswa</label>
          <input
            type="text"
            id="nama"
            placeholder="Masukkan nama lengkap"
            required
          />
        </div>
        <div class="form-group">
          <label for="nim">NIM</label>
          <input type="text" id="nim" placeholder="Masukkan NIM" required />
        </div>
        <div class="btn-group">
          <button type="submit" id="btn-simpan">Simpan</button>
          <button type="button" id="btn-batal" class="hidden">Batal</button>
        </div>
      </form>

      <div class="card">
        <h2>Daftar Mahasiswa</h2>
        <table>
          <thead>
            <tr>
              <th>No</th>
              <th>Nama</th>
              <th>NIM</th>
              <th>Tanggal Dibuat</th>
              <th>Aksi</th>
            </tr>
          </thead>
          <tbody id="tabel-mahasiswa">
            <tr>
              <td colspan="5" class="center">Memuat data...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
